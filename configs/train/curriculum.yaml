n_epochs: 100
batch_size: 32
lr: 3.0e-4
weight_decay: 1.0e-4
warmup_ratio: 0.1
use_amp: false
patience: 30
num_workers: 2

loss_type: nmse_only

alpha: 1.0
beta: 0.1
gamma: 0.05

# Curriculum stages: (end_epoch, [v_min_kmh, v_max_kmh])
curriculum_stages:
  - [30, [30.0, 35.0]]
  - [60, [30.0, 45.0]]
  - [100, [30.0, 50.0]]
