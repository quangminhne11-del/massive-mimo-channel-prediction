# Per-velocity narrow-band training. Unified recipe for ALL 5 models (fair):
# nmse_only (escapes reliably; MSE-warmup traps), lr=5e-4 (sweet spot), cosine,
# short warmup, 200 epochs (narrow band converges faster than the wide range).
n_epochs: 200
batch_size: 64
lr: 5.0e-4
weight_decay: 1.0e-4
warmup_ratio: 0.02
use_amp: false
patience: 50
num_workers: 0
lr_schedule: cosine
loss_type: nmse_only
