seed: 42
output_dir: data_sionna

# System (IEICE setup)
n_bs: 64
n_rf: 8
n_m: 4
f_carrier_ghz: 30.0
# 0.125ms = 1 slot 5G NR @ 120kHz SCS (FR2/30GHz). 0.625ms cũ làm fD vượt Nyquist
# từ v=29km/h -> kênh Sionna alias thành nhiễu trắng, không model nào dự đoán được.
t_sample_ms: 0.125

p_frames: 10
q_frames: 5

# Vận tốc rộng [10,120] -> Doppler-aware encoding có việc làm, NN không sụp OOD
velocity_range_train: [10.0, 120.0]
delay_spread_range: [25.0, 250.0]
snr_range_train: [5.0, 25.0]

# Test cố định
test_velocities: [30, 50, 70, 90, 120]
test_delay_spread: 50.0
test_snr: 20.0

n_train: 8000
n_val: 1000
n_test_per_scenario: 500
gen_batch: 256
