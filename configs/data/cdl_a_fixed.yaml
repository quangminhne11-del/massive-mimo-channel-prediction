# Variant of cdl_a.yaml: training SNR locked at 20 dB to match the test scenarios.
# Rationale (FIX.md exp1): under U[10,20] dB the model wastes capacity learning to
# denoise observations the test set never has. Locking train SNR removes that
# unnecessary variance.
seed: 42
output_dir: data_fixed

# System parameters (unchanged from cdl_a.yaml)
n_bs: 64
n_rf: 8
n_m: 4
f_carrier_ghz: 30.0
t_sample_ms: 0.625
n_paths: 23

p_frames: 30
q_frames: 5
l_frames: 10

# Train-time variance: keep velocity + delay-spread random, but lock SNR.
velocity_range_train: [30.0, 50.0]
delay_spread_range: [25.0, 250.0]
snr_range_train: [20.0, 20.0]

n_train: 8000
n_val: 1000
n_test_per_scenario: 500
